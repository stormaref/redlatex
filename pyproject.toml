[project]
name = "pdf-revision-diff"
version = "0.1.0"
description = "Side-by-side, word-level visual diff of two compiled versions of a LaTeX document"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aref Azizian" }]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.28.2",
]
keywords = ["latex", "pdf", "diff", "revision", "manuscript"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.scripts]
pdf-revision-diff = "pdf_revision_diff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_revision_diff"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
