[project]
name = "redlatex"
version = "0.1.0"
description = "Side-by-side, word-level visual diff of two compiled versions of a LaTeX document"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aref Azizian" }]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.28.2",
]
keywords = ["latex", "pdf", "diff", "revision", "manuscript"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
redlatex = "redlatex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redlatex"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",
]
